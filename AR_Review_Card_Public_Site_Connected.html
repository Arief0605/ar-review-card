<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Review Card</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:white;border:1px solid #e5eaf2;border-radius:24px;padding:28px;box-shadow:0 16px 50px #14223b12}.logo{width:48px;height:48px;border-radius:15px;background:#1e2d4b;color:white;display:grid;place-items:center;font-weight:900;letter-spacing:-1px}.tag{display:inline-block;margin-top:22px;background:#e9f7ef;color:#167548;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800}h1{font-size:27px;line-height:1.15;margin:14px 0 10px}p{color:#68758a;line-height:1.6;font-size:14px}.field{margin-top:20px}label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}input{width:100%;border:1px solid #dce3ed;border-radius:12px;padding:14px;font-size:16px;outline:none}input:focus{border-color:#315de8;box-shadow:0 0 0 3px #315de81a}button{width:100%;border:0;border-radius:12px;background:#315de8;color:white;font-weight:800;font-size:15px;padding:14px;margin-top:13px;cursor:pointer}button:disabled{opacity:.6}.msg{font-size:13px;margin-top:12px;color:#b42332;line-height:1.5}.foot{margin-top:24px;border-top:1px solid #edf0f5;padding-top:16px;color:#9aa4b4;font-size:11px;text-align:center}
</style>
</head>
<body>
<main class="card">
<div class="logo">AR</div>
<div class="tag">AR REVIEW CARD</div>
<h1>Bantu toko favoritmu berkembang ⭐</h1>
<p>Masukkan kode pada kartu AR Review Card untuk membuka halaman ulasan Google toko yang benar.</p>
<form id="lookup">
<div class="field"><label for="code">Kode kartu</label><input id="code" name="code" placeholder="Contoh: AR-0001" autocomplete="off" required maxlength="40"></div>
<button id="go" type="submit">Lanjut ke Google Review</button>
<div id="msg" class="msg" role="status"></div>
</form>
<div class="foot">AR Review Card · Hubungkan pelanggan dengan ulasan Google</div>
</main>
<script>
const SUPABASE_URL = 'https://mylghjgiimgsxqsiwghv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_l-Vg4td5LjUTnocEost8wA_b2tN0nAf';

const form = document.getElementById('lookup');
const input = document.getElementById('code');
const button = document.getElementById('go');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = input.value.trim().toUpperCase();

  if (!/^AR-[A-Z0-9-]{1,35}$/.test(code)) {
    msg.textContent = 'Format kode belum benar. Periksa kode pada kartu, misalnya AR-0001.';
    return;
  }

  button.disabled = true;
  msg.style.color = '#68758a';
  msg.textContent = 'Sedang mencari link ulasan toko...';

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_review_link`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_PUBLISHABLE_KEY,
        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
      },
      body: JSON.stringify({ card_code: code })
    });

    if (!response.ok) {
      throw new Error(`Permintaan gagal (${response.status}).`);
    }

    const reviewUrl = await response.json();
    if (typeof reviewUrl !== 'string' || !reviewUrl.trim()) {
      msg.style.color = '#b42332';
      msg.textContent = 'Kode tidak ditemukan atau kartu belum diaktifkan. Periksa kode atau hubungi toko.';
      return;
    }

    const parsedUrl = new URL(reviewUrl);
    if (parsedUrl.protocol !== 'https:') {
      throw new Error('Link ulasan toko tidak valid.');
    }

    msg.style.color = '#167548';
    msg.textContent = 'Berhasil! Membuka Google Review...';
    window.location.assign(parsedUrl.href);
  } catch (error) {
    console.error(error);
    msg.style.color = '#b42332';
    msg.textContent = 'Belum bisa membuka link. Coba lagi sebentar atau hubungi admin.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body></html>
