<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Review Card</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:system-ui,sans-serif;
  background:#f4f7fb;
  color:#172033
}
.card{
  width:min(100%,460px);
  padding:28px;
  background:white;
  border:1px solid #e5eaf2;
  border-radius:24px;
  box-shadow:0 16px 50px #14223b12
}
.logo{
  width:48px;height:48px;border-radius:15px;
  display:grid;place-items:center;
  background:#1e2d4b;color:white;
  font-weight:900;font-size:20px
}
.tag{
  display:inline-block;margin-top:22px;
  padding:6px 11px;border-radius:999px;
  background:#e9f7ef;color:#167548;
  font-size:12px;font-weight:800
}
h1{font-size:27px;line-height:1.2;margin:14px 0 10px}
p{color:#68758a;line-height:1.6;font-size:14px}
label{display:block;font-size:13px;font-weight:800;margin:20px 0 8px}
input{
  width:100%;padding:14px;border:1px solid #dce3ed;
  border-radius:12px;font-size:16px
}
button{
  width:100%;padding:14px;margin-top:13px;
  border:0;border-radius:12px;background:#315de8;
  color:white;font-size:15px;font-weight:800
}
button:disabled{opacity:.6}
.msg{font-size:13px;margin-top:12px;line-height:1.5}
.foot{
  margin-top:24px;padding-top:16px;
  border-top:1px solid #edf0f5;
  color:#9aa4b4;font-size:11px;text-align:center
}
</style>
</head>

<body>
<main class="card">
  <div class="logo">AR</div>
  <div class="tag">AR REVIEW CARD</div>

  <h1>Bantu toko favoritmu berkembang ⭐</h1>
  <p>Masukkan kode pada kartu untuk membuka halaman ulasan Google toko yang benar.</p>

  <form id="lookup">
    <label for="code">Kode kartu</label>
    <input id="code" name="code"
      placeholder="Contoh: AR-0001"
      autocomplete="off" maxlength="40" required>

    <button id="go" type="submit">Lanjut ke Google Review</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>

  <div class="foot">AR Review Card · Hubungkan pelanggan dengan ulasan Google</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://mylghjgiimgsxqsiwghv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_l-Vg4td5LjUTnocEost8wA_b2tN0nAf';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('lookup');
const input = document.getElementById('code');
const button = document.getElementById('go');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const code = input.value.trim().toUpperCase();

  if (!/^AR-[A-Z0-9-]{1,35}$/.test(code)) {
    msg.style.color = '#b42332';
    msg.textContent = 'Format kode salah. Contoh: AR-0001.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Memeriksa kode...';
  msg.style.color = '#68758a';
  msg.textContent = 'Sedang memeriksa kartu kamu.';

  try {
    const { data, error } = await supabase.rpc(
      'get_review_link',
      { card_code: code }
    );

    if (error) {
      console.error(error);
      throw new Error('Koneksi belum berhasil. Silakan coba lagi.');
    }

    if (!data) {
      msg.style.color = '#b42332';
      msg.textContent = 'Kode tidak ditemukan atau kartu belum aktif. Periksa kembali kode kartu kamu.';
      return;
    }

    let reviewUrl;

    try {
      reviewUrl = new URL(data);
    } catch {
      throw new Error('Link ulasan toko belum valid.');
    }

    if (reviewUrl.protocol !== 'https:' ||
        !['google.com', 'www.google.com', 'maps.app.goo.gl',
          'g.page', 'search.google.com'].includes(reviewUrl.hostname)) {
      throw new Error('Link ulasan toko tidak valid.');
    }

    msg.style.color = '#167548';
    msg.textContent = 'Kode berhasil! Membuka Google Review...';

    window.location.assign(reviewUrl.href);

  } catch (error) {
    msg.style.color = '#b42332';
    msg.textContent = error.message ||
      'Terjadi kesalahan. Silakan coba lagi.';
  } finally {
    button.disabled = false;
    button.textContent = 'Lanjut ke Google Review';
  }
});
</script>
</body>
</html>
